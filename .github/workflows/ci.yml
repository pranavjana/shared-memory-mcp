name: CI
on:
  push:
    branches: [main, codex/development]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      falkordb:
        image: falkordb/falkordb-server@sha256:8e4fe29e6646890a9deaf2f009ad2bc5e592d79fe9cd718810c3a97a8bcd34c0
        env:
          REDIS_ARGS: --requirepass local-verification
        ports:
          - 16379:6379
        options: >-
          --health-cmd "redis-cli -a local-verification ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check:web
      - run: npm test
      - run: npm run test:graph
      - run: node --import tsx --test test/api.integration.ts
      - name: Check bundled operating guide
        run: cmp skills/shared-memory/SKILL.md plugin/shared-memory/skills/shared-memory/SKILL.md
